name: Build

on:
  push:
    branches: [ main, master ]
    tags-ignore: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 27.3.13750724
  CMAKE_VERSION: 3.22.1
  COMPILE_SDK: 35
  BUILD_TOOLS: 35.0.0
  # sec/checkSign.cpp 里硬编码的期望值 = md5(md5(证书DER));换签名必须同步改这里
  EXPECTED_CERT_MD5_OF_MD5: 43d7c3de4793b2b46c2977863f41e122

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vector 的 API jar 是 Java 21 编译的(class file major 65),必须用 JDK 21 才能读到
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      # 不用 android-actions/setup-android:它会执行已被移除的 `sdkmanager tools` 而失败
      - name: Install SDK components
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          echo "sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          ls "${ANDROID_SDK_ROOT}/ndk"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify packaged module layout
        run: |
          set -e
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "APK: $APK"
          ENTRIES="$(unzip -l "$APK")"
          echo "$ENTRIES"
          # Vector daemon 靠这些文件发现模块入口(MODERN 策略: targetApiVersion >= 101)
          echo "$ENTRIES" | grep -q "META-INF/xposed/module.prop"    || { echo "!! 缺少 module.prop"; exit 1; }
          echo "$ENTRIES" | grep -q "META-INF/xposed/java_init.list" || { echo "!! 缺少 java_init.list"; exit 1; }
          echo "$ENTRIES" | grep -q "META-INF/xposed/native_init.list" || { echo "!! 缺少 native_init.list"; exit 1; }
          # soLoader 只接受 lib/arm64-v8a/<纯文件名>.so
          echo "$ENTRIES" | grep -q "lib/arm64-v8a/libFunJni.so" || { echo "!! 缺少模块 so"; exit 1; }
          echo "$ENTRIES" | grep -q "lib/arm64-v8a/libsecure.so" || { echo "!! 缺少 libsecure.so"; exit 1; }
          # 二进制必须导出 native_init,否则框架会判装载失败
          unzip -p "$APK" lib/arm64-v8a/libFunJni.so > /tmp/libFunJni.so
          "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            --dynamic --defined-only /tmp/libFunJni.so | grep -q " T native_init$" \
            || { echo "!! libFunJni.so 没有导出 native_init"; exit 1; }
          # Vector 要求非 debuggable
          if "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "!! release APK 仍然是 debuggable"; exit 1
          fi
          echo "layout ok"

      # 反盗版会 System.exit(9),签名对不上模块 App 直接闪退,这里提前把关
      - name: Verify anti-piracy signature
        run: |
          set -e
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          CERT="$("${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "$APK" \
                  | grep -i 'certificate MD5 digest' | head -1 | sed 's/.*digest: //' | tr -d '\r')"
          echo "cert md5 = $CERT"
          GOT="$(python3 -c "import hashlib,sys; print(hashlib.md5(sys.argv[1].encode()).hexdigest())" "$CERT")"
          echo "md5(md5) = $GOT   expect = ${EXPECTED_CERT_MD5_OF_MD5}"
          [ "$GOT" = "${EXPECTED_CERT_MD5_OF_MD5}" ] || { echo "!! 签名与 checkSign.cpp 期望不符"; exit 1; }

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p artifacts
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} artifacts/ \;
          # 单独抽出模块 so,方便直接丢进目标 app 做分析
          unzip -p artifacts/*.apk lib/arm64-v8a/libFunJni.so > artifacts/libFunJni-arm64-v8a.so
          ls -lh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunJni-release
          path: artifacts/
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
            **/build/reports/
          if-no-files-found: ignore
