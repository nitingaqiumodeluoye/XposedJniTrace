plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhenxi.jnitrace'
    compileSdk 35
    buildToolsVersion "35.0.0"
    // 与 Vector 仓库一致的 NDK pin(模块 so 要能被 Vector 的 soLoader 装载)
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "com.zhenxi.jnitrace"
        // Vector 要求 minSdk >= 27;soLoader 目前只支持 arm64-v8a
        minSdk 27
        targetSdk 28
        versionCode 3
        versionName "1.2"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // HomePath 给 nativeLib / sec 的 CMakeLists 定位源码树
                arguments "-DHomePath=" + project.rootProject.projectDir
            }
        }
    }

    buildFeatures {
        // CLog/LHook 里用到了 BuildConfig.project_name / is_printf_log
        buildConfig true
    }

    // 不用 aidl = true:服务层(含 IWbService/IWbScopeCallback 等 AIDL 生成的接口)已经
    // 编成 app/libs/vector-service.jar 导入,与 vector-api-compile-only.jar 同一套做法。

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        // META-INF/xposed/* 必须原样进包,否则 daemon 发现不到模块入口
        // (MODERN 策略读 java_init.list / native_init.list / module.prop)
        resources {
            merges += "META-INF/xposed/*"
        }
        // 模块 so 保持不压缩(和 Vector 示例一致)
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        // 反盗版(sec/checkSign.cpp)比对的是这张证书的 MD5,
        // 所以 debug/release 都必须用仓库自带的 jnitraceKey.jks,不能换 key
        debug {
            storeFile file("jnitraceKey.jks")
            storePassword 'jnitrace'
            keyAlias 'jnitrace'
            keyPassword 'jnitrace'
        }
        release {
            storeFile file("jnitraceKey.jks")
            storePassword 'jnitrace'
            keyAlias 'jnitrace'
            keyPassword 'jnitrace'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField "boolean", "is_printf_log", "true"
            buildConfigField "String", "project_name", "\"FunJni\""
        }
        release {
            // Vector 硬约束:模块 APK 必须是 release(非 debuggable)。
            // debuggable 的 APK 永远 run-from-apk,系统拒绝 dex2oat,
            // 会把宿主启动拖慢 5~10 秒。签名用 debug key 是允许的。
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 这是个调试工具,release 也保留 logcat 输出(只影响日志,不影响 debuggable 标志)
            buildConfigField "boolean", "is_printf_log", "true"
            buildConfigField "String", "project_name", "\"FunJni\""
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.material:material:1.1.0'

    // Vector 框架在目标进程里提供这些类(WbLoadPackage / XposedBridge / XSharedPreferences ...),
    // 只用于编译,不打包。jar 从 Vector 的 xposed + legacy 两个模块的 compile 产物导出,
    // Vector API 变更时需要重新导出(见 README)。
    compileOnly files('libs/vector-api-compile-only.jar')

    // Vector 的模块侧服务层:WbService / WbServiceHelper / WbProvider / RemotePreferences
    // 以及 IWbService 等 AIDL 生成的接口。与上面那个 jar 不同,这份必须用 implementation —
    // WbProvider 真的要在本 APK 里运行:daemon 的 ModuleAppService.sendBinder() 是靠
    // authority "<applicationId>.WbService" 调 getContentProviderExternal 找到进程,
    // 再 provider.call("SendBinder", ...) 把框架的 IWbService binder 投递进来的。
    // compileOnly 的话 provider 不在包里,daemon 会连续重试 3 次后节流 60s。
    //
    // 来源:E:/52/Vector/services/libxposed-service 的 release classes.jar
    // (namespace de.wwb.android.wbosed.service.lib,与 Vector 同一套源码)。
    implementation files('libs/vector-service.jar')
}
